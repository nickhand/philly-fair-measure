[project]
name = "philly-fair-measure"
version = "0.1.0"
description = "Independent open-data check of Philadelphia property assessments: verified public-data pipeline, valuation models, and a per-property assessment screen"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick Hand" }]
requires-python = ">=3.12"
dependencies = [
    "assesspy>=2.0.2",
    "catboost>=1.2.10",
    "duckdb>=1.0",
    "fastapi>=0.139.0",
    "httpx>=0.27",
    "lightgbm>=4.6.0",
    "numpy>=2.4",
    "nutpie>=0.16.11",
    "pillow>=12.3.0",
    "polars>=1.42.1",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pymc>=6.0.1",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18",
    "shapely>=2.1.2",
    "tenacity>=8.3",
    "uvicorn>=0.50.0",
]

[project.urls]
Homepage = "https://nickhand.dev/fair-measure/"
Repository = "https://github.com/nickhand/philly-fair-measure"
Documentation = "https://github.com/nickhand/philly-fair-measure/blob/main/docs/model.md"

[project.scripts]
fair-measure = "philly_fair_measure.cli:main"
fm = "philly_fair_measure.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
    "ty>=0.0.97",
]
# Serve-time dependencies: the ONLY third-party packages the API may import.
# The Docker image and the smoke venv (`just api-smoke`) install this group
# straight from uv.lock (`uv sync --frozen --only-group serve`), so they run
# the exact versions the project is locked and tested on, and a training-only
# import leaking into the serve path fails the smoke gate instead of
# production. Versions come from `dependencies` above; list names only here.
serve = [
    # the point estimate is a LightGBM+CatBoost stack: score_point and the
    # report's blended-SHAP drivers load both models per run
    "catboost",
    "fastapi",
    "lightgbm",
    "numpy",
    "polars",
    "pydantic",
    "uvicorn[standard]",
]
# The smoke script's test client; installed beside `serve` in the smoke venv
# only, never in the image.
serve-smoke = ["httpx"]

# uv.lock records this setting. Declaring it in the project, not only in a
# user-level uv config, keeps the lock identical in CI, where `uv sync --locked`
# would otherwise fail.
[tool.uv]
exclude-newer = "1 week"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Stored notebooks are executed artifacts; reformatting their cells would desync
# the code from the captured outputs without re-execution.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# ANN keeps every function annotated: ty checks the types that are written but,
# unlike mypy --strict, does not require them.
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
# Any is the honest annotation at the JSON and untyped-library boundaries.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# The type gate covers src only; test functions are not annotated.
"tests/**" = ["ANN"]

# Type checking: `ty check` (the target Python version comes from
# requires-python above).
[tool.ty.src]
include = ["src"]

# ty has no strict switch; these are the rules its migration guide maps to
# mypy --strict. missing-type-argument stays off on purpose: NumPy generic typing
# (bare np.ndarray) is chased at boundaries via NDArray, not enforced everywhere.
[tool.ty.rules]
dynamic-function-decorator-return = "error"
possibly-unresolved-reference = "error"
unsound-return-statement = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[tool.ty.analysis]
# assesspy annotates its inputs as list | pandas.Series but accepts any
# array-like; checking calls against those annotations only produces noise.
replace-imports-with-any = ["assesspy.**"]
# scipy.spatial re-exports cKDTree from a compiled extension ty cannot read.
allowed-unresolved-imports = ["scipy.spatial.cKDTree"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not live and not slow'"
markers = [
    "live: tests that hit real external APIs (deselected by default; run with -m live)",
    "slow: tests that take more than ~10s, e.g. MCMC smoke tests (run with -m slow)",
]
testpaths = ["tests"]
