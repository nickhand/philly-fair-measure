# Weekly snapshots of the current-only CARTO tables (the city overwrites
# these in place, so our snapshots are the only history that exists).
#
# Each run: pull the previous snapshot from S3 -> fetch fresh copies ->
# upload to S3 -> commit a small diff summary to docs/snapshots/. That commit
# doubles as a keepalive: GitHub disables cron workflows in public repos after
# 60 days without repository activity, and a weekly bot commit resets the
# clock. One-time AWS setup lives in docs/snapshots/README.md.
name: snapshot

on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC; odd minute dodges the top-of-hour rush
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for assuming the AWS role
  contents: write # push the diff summary commit

concurrency:
  group: snapshot
  cancel-in-progress: false

env:
  # Parcel-level delinquencies have returned permission denied since 2026-09-21.
  # Keep historical snapshots; see docs/snapshots/README.md before re-enabling.
  TABLES: opa_properties_public assessments

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Report paused source
        run: |
          echo "::warning title=Delinquency snapshots paused::real_estate_tax_delinquencies is no longer publicly readable on CARTO (HTTP 403, verified 2026-11-02). Historical snapshots remain in S3. See docs/snapshots/README.md."
          echo "Parcel-level tax delinquency snapshots are paused: CARTO returns permission denied. Last successful scheduled capture: 2026-09-14. See docs/snapshots/README.md." >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Assume AWS role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SNAPSHOT_ROLE_ARN }}
          aws-region: ${{ vars.SNAPSHOT_AWS_REGION }}

      - name: Pull previous snapshots from S3 (latest per dataset)
        run: |
          set -euo pipefail
          for ds in $TABLES; do
            prefix="raw/source=carto/dataset=$ds/"
            # `aws s3 ls` exits 1 on an empty prefix, which a new table has
            # until its first upload. list-objects-v2 exits 0 with no prefixes.
            latest=$(aws s3api list-objects-v2 --bucket "${{ vars.SNAPSHOT_BUCKET }}" \
                --prefix "$prefix" --delimiter / --output json \
              | jq -r --arg prefix "$prefix" '.CommonPrefixes[]?.Prefix | ltrimstr($prefix)
                  | select(startswith("fetched_at=") and (endswith(".incomplete/") | not))' \
              | sort | tail -1)
            if [ -n "$latest" ]; then
              echo "previous $ds: $latest"
              aws s3 sync --no-progress \
                "s3://${{ vars.SNAPSHOT_BUCKET }}/$prefix$latest" \
                "data/$prefix$latest"
            else
              echo "no previous snapshot for $ds (first run?)"
            fi
          done

      - name: Fetch fresh snapshots
        id: fetch
        run: uv run fair-measure snapshot-all --tables $TABLES

      - name: Upload completed snapshots to S3
        # snapshot-all continues after a failed table. Preserve its successes,
        # but leave the job failed and never publish a partial snapshot.
        if: ${{ !cancelled() && (steps.fetch.outcome == 'success' || steps.fetch.outcome == 'failure') }}
        run: |
          aws s3 sync --no-progress --size-only data/raw \
            "s3://${{ vars.SNAPSHOT_BUCKET }}/raw" \
            --exclude "*.incomplete/*"

      - name: Diff against the previous snapshots
        run: |
          uv run fair-measure snapshot-diff \
            --datasets $TABLES \
            --out "docs/snapshots/$(date -u +%F).md"

      - name: Commit the summary (self-keepalive)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snapshots
          if git diff --cached --quiet; then
            echo "no summary to commit (first run without a previous snapshot)"
          else
            git commit -m "snapshot: diff summary $(date -u +%F)"
            git pull --rebase origin main
            git push origin main
          fi
